[project]
name = "brushplotter"
version = "0.0.1"
description = "GUI y librería para pintar con acrílico/acuarela usando plotters NextDraw y AxiDraw"
authors = [
    {name = "Daniel García Andújar"},
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
keywords = ["plotter", "axidraw", "nextdraw", "art", "painting", "watercolor", "acrylic"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Artistic Software",
]
dependencies = [
    "svgpathtools>=1.6.0",
    "vpype>=1.14.0",
    "PySide6>=6.6.0",
]

[project.optional-dependencies]
hardware = [
    # Instalación del SDK NextDraw (verificar URL antes de publicar):
    # pip install https://software-download.bantamtools.com/nd/api/nextdraw_api.zip
    # Para AxiDraw clásico:
    # pip install https://cdn.evilmadscientist.com/dl/ad/public/AxiDraw_API.zip
]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
brushplotter = "brushplotter.ui.main_window:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["brushplotter/tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
